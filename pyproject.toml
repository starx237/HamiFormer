[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamiformer"
version = "1.0.0"
description = "Hamiltonian and diffusion experts for physical trajectory prediction"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "torch>=2.5.1,<2.6", "h5py>=3.10"]

[project.optional-dependencies]
test = ["pytest>=8"]
data = ["pymunk==7.3.0", "pybullet==3.2.7"]
analysis = ["scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.8", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
